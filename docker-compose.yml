services:
  tdx-api:
    # 默认本地构建；只想用 GHCR 镜像时注释掉 build 段，执行 docker compose pull
    build: .
    image: ghcr.io/garretqaq/tdx-api:latest
    container_name: tdx-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    # .env 中定义 TDX_API_KEYS 等变量，单一配置源
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    # 容器内 HEALTHCHECK 已定义，compose 沿用
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
